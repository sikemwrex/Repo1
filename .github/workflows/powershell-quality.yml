name: PowerShell Quality

# Validation invariant: every proposed PR revision and every resulting main revision
# must receive a fresh validation run. Do not rely on a prior green commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact revision checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            Write-Error "Checked out revision $actual but required exact revision $env:EXPECTED_SHA"
            exit 1
          }
          "Validated repository revision: $actual" | Write-Output

      - name: Record runner environment identity
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "Runner OS: $($os.Caption) $($os.Version) build $($os.BuildNumber)" | Write-Output
          "Runner image OS: $env:ImageOS" | Write-Output
          "Runner image version: $env:ImageVersion" | Write-Output
          "PowerShell edition: $($PSVersionTable.PSEdition)" | Write-Output
          "PowerShell version: $($PSVersionTable.PSVersion)" | Write-Output
          "Runner architecture: $env:PROCESSOR_ARCHITECTURE" | Write-Output

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Verify PSScriptAnalyzer version
        shell: pwsh
        run: |
          $version = (Get-Module PSScriptAnalyzer -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1).Version.ToString()
          if ($version -ne '1.25.0') {
            Write-Error "PSScriptAnalyzer version $version installed; required 1.25.0"
            exit 1
          }
          "PSScriptAnalyzer version: $version" | Write-Output

      - name: PowerShell syntax validation
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path scripts,tests,config -Recurse -Include *.ps1,*.psd1 -ErrorAction SilentlyContinue
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "Syntax errors in $($file.FullName): $($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $findings = @()
          $findings += Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning,Error
          $findings += Invoke-ScriptAnalyzer -Path tests -Recurse -Severity Warning,Error
          $findings | Format-Table -AutoSize
          if ($findings) { exit 1 }

      - name: Gate A read-only collector guard
        shell: pwsh
        run: ./tests/host-readiness/Test-GateAReadOnly.ps1

      - name: Gate A collector smoke test
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'cu-gate-a-smoke'
          ./scripts/host/Get-CUVMHostReadiness.ps1 -OutputRoot $root

          $capture = Get-ChildItem -LiteralPath $root -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $capture) {
            Write-Error 'Gate A collector produced no capture directory.'
            exit 1
          }

          $rawPath = Join-Path $capture.FullName 'GateA-Raw.json'
          $sanitizedPath = Join-Path $capture.FullName 'GateA-Sanitized.json'
          if (-not (Test-Path -LiteralPath $rawPath) -or -not (Test-Path -LiteralPath $sanitizedPath)) {
            Write-Error 'Gate A collector did not produce both evidence files.'
            exit 1
          }

          $sanitized = Get-Content -LiteralPath $sanitizedPath -Raw | ConvertFrom-Json
          $actualRawHash = (Get-FileHash -LiteralPath $rawPath -Algorithm SHA256).Hash
          if ($sanitized.RawEvidenceSha256 -ne $actualRawHash) {
            Write-Error 'Gate A sanitized evidence is not bound to the produced raw evidence hash.'
            exit 1
          }
          if (-not $sanitized.EvidenceId -or -not $sanitized.CollectorSha256) {
            Write-Error 'Gate A evidence identity/provenance fields are incomplete.'
            exit 1
          }

          'Gate A collector smoke test: PASS' | Write-Output

      - name: VM configuration contract
        shell: pwsh
        run: ./tests/static/Test-VMConfigContract.ps1

      - name: Static compliance structure guard
        shell: pwsh
        run: ./tests/static/Test-ComplianceCoverage.ps1

      - name: Runtime compliance behavioral regression
        shell: pwsh
        run: ./tests/behavioral/Test-ComplianceBehavior.ps1

      - name: Trusted checkpoint-lineage oracle self-test
        shell: pwsh
        run: ./tests/trusted/Test-CheckpointLineageOracle.ps1 -SelfTest
