name: Trusted Validator Meta Gate

# This workflow is sourced from the accepted base branch. Candidate revisions
# cannot redefine the policy/oracle used to judge their validation-sensitive changes.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  trusted-validation-policy:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Verify same-repository candidate
        shell: pwsh
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if ($env:HEAD_REPO -ne $env:TARGET_REPO) {
            Write-Error "Trusted meta gate refuses to execute fork-supplied candidate code."
            exit 1
          }

      - name: Checkout trusted base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout exact candidate head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Verify trusted and candidate revisions
        shell: pwsh
        env:
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $trustedActual = (git -C trusted rev-parse HEAD).Trim()
          $candidateActual = (git -C candidate rev-parse HEAD).Trim()
          if ($trustedActual -ne $env:TRUSTED_SHA) {
            Write-Error "Trusted checkout $trustedActual; required $env:TRUSTED_SHA"
            exit 1
          }
          if ($candidateActual -ne $env:CANDIDATE_SHA) {
            Write-Error "Candidate checkout $candidateActual; required $env:CANDIDATE_SHA"
            exit 1
          }
          "Trusted base revision: $trustedActual" | Write-Output
          "Candidate revision: $candidateActual" | Write-Output

      - name: Self-test accepted-base trusted policy and lineage oracle
        shell: pwsh
        run: |
          ./trusted/tests/trusted/Test-CheckpointLineageOracle.ps1 -SelfTest
          ./trusted/tests/trusted/Test-ValidationChangePolicy.ps1 -SelfTest

      - name: Enforce accepted-base validation-change policy
        shell: pwsh
        env:
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $changed = @(git -C candidate diff --name-only $env:TRUSTED_SHA $env:CANDIDATE_SHA)
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Unable to calculate exact base-to-head changed-file set."
            exit 1
          }
          "Changed files:" | Write-Output
          $changed | ForEach-Object { " - $_" | Write-Output }

          ./trusted/tests/trusted/Test-ValidationChangePolicy.ps1 `
            -ChangedFiles $changed `
            -CandidateValidatorPath ./candidate/scripts/validation/Test-CUVMCompliance.ps1 `
            -TrustedConfigPath ./trusted/config/vm-spec.psd1
